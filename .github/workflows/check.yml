# Every PR and every push to main: the game must build, then survive a short scripted fight as each hero
# (tools/smoke/smoke.mjs). Run the same thing locally with `npm run build && npm run smoke`.
name: Build and smoke test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04   # Playwright 1.56 has no Chromium for ubuntu-latest (26.04)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screens
          path: smoke-*.png
          if-no-files-found: ignore
