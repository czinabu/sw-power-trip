# Every PR and every push to main: the game must build, then survive a short scripted fight as each hero
# (tools/smoke/smoke.mjs). Run the same thing locally with `npm run build && npm run smoke`.
name: Build and smoke test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
