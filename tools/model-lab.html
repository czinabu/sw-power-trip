<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>POWER TRIP model lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #0d1016; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; color: #cfd6e0; }
  #bar { position: fixed; top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; }
  #bar button { background: #1b212b; color: inherit; border: 1px solid #2c3442; padding: 5px 10px; cursor: pointer; }
  #bar button.on { border-color: #5fd8ff; color: #fff; }
  #cap { position: fixed; bottom: 12px; left: 0; right: 0; display: flex; justify-content: space-around; z-index: 2; pointer-events: none;
         font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; color: #9aa6b6; }
</style>
</head>
<body>
<div id="bar"></div>
<div id="cap"></div>
<script type="module" src="./model-lab.js"></script>
</body>
</html>
