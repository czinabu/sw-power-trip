<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>POWER TRIP progression lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; background: #0d1016; font: 13px/1.4 system-ui, sans-serif; color: #cfd6e0; }
  main { max-width: 980px; margin: 0 auto; padding: 18px 16px 40px; }
  h1 { font-size: 16px; letter-spacing: .12em; margin: 0 0 4px; }
  p.hint { color: #7d8898; margin: 0 0 14px; }
  h2 { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #9aa6b6; margin: 22px 0 6px; }
  label { display: inline-flex; gap: 8px; align-items: center; }
  .wrap { overflow-x: auto; }
  table { border-collapse: collapse; min-width: 100%; }
  th, td { text-align: right; padding: 4px 10px; border-bottom: 1px solid #1f2633; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: #9aa6b6; font-weight: 600; }
  td.ok { color: #7fe0a8; } td.warn { color: #ffd24a; }
</style>
</head>
<body>
<main>
  <h1>PROGRESSION LAB</h1>
  <p class="hint">What a campaign pays out in XP, and how much of each build that buys. Reads the live tables in src/data/, so edit a price and Vite reloads the page.</p>
  <label>Kill-streak average <input id="streak" type="range" min="1" max="3" step="0.1" value="1.3"> <b id="streakv"></b></label>
  <div id="out"></div>
</main>
<script type="module" src="./progression-lab.js"></script>
</body>
</html>
